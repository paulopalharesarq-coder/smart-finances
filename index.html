  <!-- Immediate Theme & Status Bar Initialization (Prevents FOUC & Syncs iOS Status Bar) -->
  <script>
    (function () {
      try {
        const pref = localStorage.getItem('stitch_theme_preference') || 'system';
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = pref === 'dark' || (pref === 'system' && systemDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
        const themeColorMeta = document.getElementById('app-theme-color');
        if (themeColorMeta) themeColorMeta.setAttribute('content', isDark ? '#18120d' : '#fff8f5');
        const statusMeta = document.getElementById('app-status-bar-style');
        if (statusMeta) statusMeta.setAttribute('content', isDark ? 'black' : 'default');
      } catch (e) {}
    })();
  </script>

  <!-- Service Worker Registration & User-Controlled Update Engine -->
  <script>
    (function () {
      let waitingWorker = null;
      let userTriggeredUpdate = false;
      let isRefreshing = false;

      window.showUpdateBanner = function (worker) {
        if (worker) waitingWorker = worker;
        const banner = document.getElementById('pwa-update-banner');
        if (banner) {
          banner.classList.remove('hidden');
        }
      };

      window.applyPendingUpdate = function () {
        userTriggeredUpdate = true;
        const btn = document.getElementById('pwa-update-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> Atualizando...';
        }

        if (waitingWorker) {
          waitingWorker.postMessage({ type: 'SKIP_WAITING' });
        } else if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then((reg) => {
            if (reg && reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            } else {
              window.location.reload();
            }
          }).catch(() => {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      };

      if ('serviceWorker' in navigator) {
        // ONLY reload if the controller change was explicitly requested by the user
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (userTriggeredUpdate && !isRefreshing) {
            isRefreshing = true;
            console.log('[PWA] Nova versão ativada pelo usuário! Recarregando...');
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado! Escopo:', reg.scope);

              // 1. Check if there is already a worker waiting from a previous session
              if (reg.waiting) {
                console.log('[PWA] Versão aguardando ativação detectada no início da sessão.');
                window.showUpdateBanner(reg.waiting);
              }

              // 2. Proactively check for SW updates
              reg.update().catch(() => {});

              // 3. Listen for new update installation
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    // Only show banner if there is already an active controller (meaning it is an update, not first visit)
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Nova versão instalada e pronta para ativação sob demanda.');
                      window.showUpdateBanner(newWorker);
                    }
                  });
                }
              });

              // 4. iOS PWA & Mobile Foreground Check: Check for updates when app gains focus or becomes visible
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  reg.update().catch(() => {});
                  if (reg.waiting) {
                    window.showUpdateBanner(reg.waiting);
                  }
                }
              });
              window.addEventListener('focus', () => {
                reg.update().catch(() => {});
                if (reg.waiting) {
                  window.showUpdateBanner(reg.waiting);
                }
              });
            })
            .catch((err) => {
              console.warn('[PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    })();
  </script>
